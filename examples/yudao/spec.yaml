# 芋道 ERP/CRM 业务中台 · 结构化需求 Spec（子集）
# 对照器：examples/jxc/scripts/check-spec.ts（五维：实体字段/枚举/页面/按钮/动作）
# 来源：doc.iocoder.cn 官方手册（/erp/build/、/crm/build/、/erp/purchase/、/erp/product/、/erp/stock/、
#       /crm/customer/、/crm/business/、/crm/receivable/、/crm/contract/、/crm/clue/）
# 裁剪：多租户/数据权限/工作流审批/用户组织/Excel 导入导出/报表大屏/消息定时任务/移动端——通用字段
#       （creator/updater/create_time/update_time/deleted/tenant_id）不入实体；按钮保留业务操作代表集。
# 用途：验证 TDSL 对真实企业级系统的能力覆盖，产出缺口清单（记入 docs/dev/40_验收报告）。

system:
  id: yudao
  name: 芋道 ERP/CRM 业务中台（TDSL 能力验证子集）
  description: >-
    ERP：产品管理（分类/单位/产品）、库存管理（仓库/产品库存/库存明细/库存盘点）、
    采购管理（订单/入库/退货/付款）、销售管理（订单/出库/退货/收款）、财务管理（结算账户/收付款汇总）。
    CRM：线索/客户（联系人/公海/限制配置）、商机（状态组/阶段）、合同（明细/提醒配置）、
    回款（计划/回款/审批）、产品（分类/产品）、通用（跟进记录/待办事项）。
    单据两态（未审批/已审批）+ 审批/反审批流转；CRM 单据含审批状态机（提交/通过/驳回）。

