# ───────────────────────── 模块/功能/页面/按钮 ─────────────────────────
# 页面 id 即 TDSL page/dialog 名；按钮 name 与页面 button text 一致。
# 查询条件（search）为字段在场校验；条件到 where 的接线属于 codegen 语义层，另记缺口。

modules:
  # ══════════ ERP · 产品管理 ══════════
  - id: product
    name: 产品管理
    functions:
      - id: erp-category
        name: 产品分类
        pages:
          - id: erpProductCategoryList
            name: 产品分类列表
            kind: list
            entity: ProductCategory
            query: queryErpProductCategory
            columns: [name, code, sort, status]
            search: [name, status]
