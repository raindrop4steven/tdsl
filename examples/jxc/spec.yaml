# 进销存管理系统 · 结构化需求 Spec
# 对照器：npm run check-spec（scripts/check-spec.ts，五维：实体字段/枚举/页面/按钮/动作）
# 来源：Known 框架 JxcLite 进销存需求（裁剪：导入/导出/附件/打印/权限/用户管理/系统设置）

system:
  id: jxc
  name: 进销存管理系统
  description: >-
    中小企业进销存：基础数据（商品/供应商/客户）、采购管理（进货单+退货）、
    销售管理（销货单+退货）、库存查询（进销存汇总）、应收应付（确认/开票/回款）。
    单据仅有 暂存/已提交 两态（非审批流）；提交后不可编辑删除。

# ───────────────────────── 数据字典 ─────────────────────────
data:
  enums:
    - id: GoodsCategory
      name: 商品类别
      items:
        - { key: FOOD, label: 食品 }
        - { key: DAILY, label: 日用品 }
        - { key: CLOTH, label: 服装 }
        - { key: OTHER, label: 其他 }
    - id: Unit
      name: 计量单位
      items:
        - { key: PIECE, label: 个 }
        - { key: KILOGRAM, label: 千克 }
        - { key: BOX, label: 箱 }
        - { key: BOTTLE, label: 瓶 }
    - id: SettleMode
      name: 结算方式
      items:
        - { key: CASH, label: 现金 }
        - { key: ACCOUNT, label: 对账 }
    - id: DocStatus
      name: 单证状态
      items:
        - { key: DRAFT, label: 暂存 }
        - { key: SUBMITTED, label: 已提交 }
    - id: PayStatus
      name: 应收应付状态
      items:
        - { key: WAIT_CONFIRM, label: 待确认 }
        - { key: WAIT_INVOICE, label: 待开票 }
        - { key: WAIT_PAY, label: 待回款 }
        - { key: DONE, label: 已完结 }

  entities:
    - id: Goods
      name: 商品
      fields:
        - { id: id, name: 主键, type: Integer, required: true }
        - { id: code, name: 商品编码, type: String, required: true }
        - { id: name, name: 商品名称, type: String, required: true }
        - { id: category, name: 商品类别, type: GoodsCategory, required: true }
        - { id: spec, name: 规格型号, type: String }
        - { id: origin, name: 产地, type: String }
        - { id: unit, name: 计量单位, type: Unit, required: true }
        - { id: purchasePrice, name: 采购单价, type: Decimal, required: true }
        - { id: salePrice, name: 销售单价, type: Decimal, required: true }
        - { id: safetyStock, name: 安全库存, type: Integer }
        - { id: remark, name: 备注, type: String }

    - id: Supplier
      name: 供应商
      fields:
        - { id: id, name: 主键, type: Integer, required: true }
        - { id: name, name: 供应商名称, type: String, required: true }
        - { id: shortName, name: 供应商简称, type: String }
        - { id: creditCode, name: 信用代码, type: String, required: true }
        - { id: contact, name: 联系人, type: String }
        - { id: phone, name: 联系电话, type: String }
        - { id: address, name: 联系地址, type: String }
        - { id: invoiceAddress, name: 开票地址, type: String }
        - { id: invoicePhone, name: 开票电话, type: String }
        - { id: bankName, name: 开户银行, type: String }
        - { id: bankAccount, name: 银行账号, type: String }
        - { id: remark, name: 备注, type: String }

    - id: Customer
      name: 客户
      fields:
        - { id: id, name: 主键, type: Integer, required: true }
        - { id: name, name: 客户名称, type: String, required: true }
        - { id: shortName, name: 客户简称, type: String }
        - { id: creditCode, name: 信用代码, type: String, required: true }
        - { id: contact, name: 联系人, type: String }
        - { id: phone, name: 联系电话, type: String }
        - { id: address, name: 联系地址, type: String }
        - { id: invoiceAddress, name: 开票地址, type: String }
        - { id: invoicePhone, name: 开票电话, type: String }
        - { id: bankName, name: 开户银行, type: String }
        - { id: bankAccount, name: 银行账号, type: String }
        - { id: remark, name: 备注, type: String }

    # 主子表：进货单（表头） + PurchaseBillItem（明细）
    - id: PurchaseBill
      name: 进货单
      fields:
        - { id: id, name: 主键, type: Integer, required: true }
        - { id: billNo, name: 进货单号, type: String, required: true }
        - { id: status, name: 单证状态, type: DocStatus, required: true }
        - { id: billDate, name: 进货日期, type: DateTime, required: true }
        - { id: supplierId, name: 供应商, type: Integer, required: true }
        - { id: contractNo, name: 合同号, type: String }
        - { id: invoiceNo, name: 发票号, type: String }
        - { id: logisticsCompany, name: 物流公司, type: String }
        - { id: logisticsNo, name: 物流单号, type: String }
        - { id: totalAmount, name: 总金额, type: Decimal }
        - { id: settleMode, name: 结算方式, type: SettleMode, required: true }
        - { id: remark, name: 备注, type: String }
    - id: PurchaseBillItem
      name: 进货明细
      fields:
        - { id: id, name: 主键, type: Integer, required: true }
        - { id: billId, name: 进货单, type: Integer, required: true }
        - { id: goodsId, name: 商品, type: Integer, required: true }
        - { id: goodsCode, name: 商品编码, type: String }
        - { id: goodsName, name: 商品名称, type: String }
        - { id: category, name: 商品类别, type: GoodsCategory }
        - { id: spec, name: 规格型号, type: String }
        - { id: unit, name: 计量单位, type: Unit }
        - { id: qty, name: 数量, type: Integer, required: true }
        - { id: price, name: 单价, type: Decimal, required: true }
        - { id: amount, name: 金额, type: Decimal }
        - { id: remark, name: 备注, type: String }

    - id: SalesBill
      name: 销货单
      fields:
        - { id: id, name: 主键, type: Integer, required: true }
        - { id: billNo, name: 销货单号, type: String, required: true }
        - { id: status, name: 单证状态, type: DocStatus, required: true }
        - { id: billDate, name: 销货日期, type: DateTime, required: true }
        - { id: customerId, name: 客户, type: Integer, required: true }
        - { id: contractNo, name: 合同号, type: String }
        - { id: invoiceNo, name: 发票号, type: String }
        - { id: logisticsCompany, name: 物流公司, type: String }
        - { id: logisticsNo, name: 物流单号, type: String }
        - { id: totalAmount, name: 总金额, type: Decimal }
        - { id: settleMode, name: 结算方式, type: SettleMode, required: true }
        - { id: remark, name: 备注, type: String }
    - id: SalesBillItem
      name: 销货明细
      fields:
        - { id: id, name: 主键, type: Integer, required: true }
        - { id: billId, name: 销货单, type: Integer, required: true }
        - { id: goodsId, name: 商品, type: Integer, required: true }
        - { id: goodsCode, name: 商品编码, type: String }
        - { id: goodsName, name: 商品名称, type: String }
        - { id: category, name: 商品类别, type: GoodsCategory }
        - { id: spec, name: 规格型号, type: String }
        - { id: unit, name: 计量单位, type: Unit }
        - { id: qty, name: 数量, type: Integer, required: true }
        - { id: price, name: 单价, type: Decimal, required: true }
        - { id: amount, name: 金额, type: Decimal }
        - { id: remark, name: 备注, type: String }

    - id: PurchaseReturnBill
      name: 进货退货单
      fields:
        - { id: id, name: 主键, type: Integer, required: true }
        - { id: billNo, name: 退货单号, type: String, required: true }
        - { id: status, name: 单证状态, type: DocStatus, required: true }
        - { id: returnDate, name: 退货日期, type: DateTime, required: true }
        - { id: sourceBillNo, name: 原进货单号, type: String, required: true }
        - { id: totalAmount, name: 总金额, type: Decimal }
        - { id: remark, name: 备注, type: String }
    - id: PurchaseReturnItem
      name: 进货退货明细
      fields:
        - { id: id, name: 主键, type: Integer, required: true }
        - { id: billId, name: 退货单, type: Integer, required: true }
        - { id: goodsId, name: 商品, type: Integer, required: true }
        - { id: goodsCode, name: 商品编码, type: String }
        - { id: goodsName, name: 商品名称, type: String }
        - { id: qty, name: 数量, type: Integer, required: true }
        - { id: price, name: 单价, type: Decimal, required: true }
        - { id: amount, name: 金额, type: Decimal }

    - id: SalesReturnBill
      name: 销货退货单
      fields:
        - { id: id, name: 主键, type: Integer, required: true }
        - { id: billNo, name: 退货单号, type: String, required: true }
        - { id: status, name: 单证状态, type: DocStatus, required: true }
        - { id: returnDate, name: 退货日期, type: DateTime, required: true }
        - { id: sourceBillNo, name: 原销货单号, type: String, required: true }
        - { id: totalAmount, name: 总金额, type: Decimal }
        - { id: remark, name: 备注, type: String }
    - id: SalesReturnItem
      name: 销货退货明细
      fields:
        - { id: id, name: 主键, type: Integer, required: true }
        - { id: billId, name: 退货单, type: Integer, required: true }
        - { id: goodsId, name: 商品, type: Integer, required: true }
        - { id: goodsCode, name: 商品编码, type: String }
        - { id: goodsName, name: 商品名称, type: String }
        - { id: qty, name: 数量, type: Integer, required: true }
        - { id: price, name: 单价, type: Decimal, required: true }
        - { id: amount, name: 金额, type: Decimal }

    - id: Payable
      name: 应付款
      fields:
        - { id: id, name: 主键, type: Integer, required: true }
        - { id: billNo, name: 关联进货单号, type: String, required: true }
        - { id: supplierId, name: 供应商, type: Integer, required: true }
        - { id: amount, name: 应付金额, type: Decimal, required: true }
        - { id: invoiceNo, name: 发票号, type: String }
        - { id: paidAmount, name: 已付金额, type: Decimal }
        - { id: status, name: 状态, type: PayStatus, required: true }
        - { id: remark, name: 备注, type: String }

    - id: Receivable
      name: 应收款
      fields:
        - { id: id, name: 主键, type: Integer, required: true }
        - { id: billNo, name: 关联销货单号, type: String, required: true }
        - { id: customerId, name: 客户, type: Integer, required: true }
        - { id: amount, name: 应收金额, type: Decimal, required: true }
        - { id: invoiceNo, name: 发票号, type: String }
        - { id: paidAmount, name: 已收金额, type: Decimal }
        - { id: status, name: 状态, type: PayStatus, required: true }
        - { id: remark, name: 备注, type: String }

# ───────────────────────── 模块/功能/页面/按钮 ─────────────────────────
# 页面 id 即 TDSL page/dialog 名；按钮 name 与页面 button text 一致。
# 查询条件（search）为字段在场校验；条件到 where 的接线属于 codegen 语义层，另记缺口。

modules:
  - id: base
    name: 基础数据
    functions:
      - id: goods
        name: 商品管理
        pages:
          - id: GoodsList
            name: 商品列表
            kind: list
            entity: Goods
            query: searchGoods
            columns: [code, name, category, spec, unit, purchasePrice, salePrice, safetyStock]
            search: [code, name, category]
            buttons:
              - { id: add, name: 新增商品, scope: page, action: { type: openDialog, target: GoodsEdit } }
              - { id: edit, name: 编辑, scope: row, action: { type: openDialog, target: GoodsEdit } }
              - { id: remove, name: 删除, scope: row, action: { type: logic, target: deleteGoods } }
          - id: GoodsEdit
            name: 商品编辑
            kind: dialog-form
            entity: Goods
            fields: [code, name, category, spec, origin, unit, purchasePrice, salePrice, safetyStock, remark]
            buttons:
              - { id: save, name: 保存, scope: page, action: { type: logic, target: saveGoods } }

      - id: supplier
        name: 供应商管理
        pages:
          - id: SupplierList
            name: 供应商列表
            kind: list
            entity: Supplier
            query: searchSuppliers
            columns: [name, shortName, contact, phone, creditCode, address]
            search: [name]
            buttons:
              - { id: add, name: 新增供应商, scope: page, action: { type: openDialog, target: SupplierEdit } }
              - { id: edit, name: 编辑, scope: row, action: { type: openDialog, target: SupplierEdit } }
              - { id: remove, name: 删除, scope: row, action: { type: logic, target: deleteSupplier } }
          - id: SupplierEdit
            name: 供应商编辑
            kind: dialog-form
            entity: Supplier
            fields: [name, shortName, creditCode, contact, phone, address, invoiceAddress, invoicePhone, bankName, bankAccount, remark]
            buttons:
              - { id: save, name: 保存, scope: page, action: { type: logic, target: saveSupplier } }

      - id: customer
        name: 客户管理
        pages:
          - id: CustomerList
            name: 客户列表
            kind: list
            entity: Customer
            query: searchCustomers
            columns: [name, shortName, contact, phone, creditCode, address]
            search: [name]
            buttons:
              - { id: add, name: 新增客户, scope: page, action: { type: openDialog, target: CustomerEdit } }
              - { id: edit, name: 编辑, scope: row, action: { type: openDialog, target: CustomerEdit } }
              - { id: remove, name: 删除, scope: row, action: { type: logic, target: deleteCustomer } }
          - id: CustomerEdit
            name: 客户编辑
            kind: dialog-form
            entity: Customer
            fields: [name, shortName, creditCode, contact, phone, address, invoiceAddress, invoicePhone, bankName, bankAccount, remark]
            buttons:
              - { id: save, name: 保存, scope: page, action: { type: logic, target: saveCustomer } }

  - id: purchase
    name: 采购管理
    functions:
      - id: purchase-bill
        name: 进货单
        pages:
          - id: PurchaseBillList
            name: 进货单列表
            kind: list
            entity: PurchaseBill
            query: searchPurchaseBills
            columns: [billNo, billDate, supplierId, status, totalAmount, settleMode]
            search: [billNo, status]
            buttons:
              - { id: add, name: 新增进货单, scope: page, action: { type: openDialog, target: PurchaseBillEdit } }
              - { id: edit, name: 编辑, scope: row, action: { type: openDialog, target: PurchaseBillEdit } }
              - { id: remove, name: 删除, scope: row, action: { type: logic, target: deletePurchaseBill } }
              - { id: copy, name: 复制, scope: row, action: { type: logic, target: copyPurchaseBill } }
              - { id: ret, name: 整单退货, scope: row, action: { type: logic, target: returnPurchaseBill } }
          - id: PurchaseBillEdit
            name: 进货单编辑
            kind: dialog-form
            entity: PurchaseBill
            fields: [billNo, billDate, supplierId, contractNo, invoiceNo, logisticsCompany, logisticsNo, settleMode, remark]
            subform:
              repeat: items
              entity: PurchaseBillItem
              fields: [goodsId, qty, price]
            buttons:
              - { id: draft, name: 暂存, scope: page, action: { type: logic, target: savePurchaseBill } }
              - { id: submit, name: 提交, scope: page, action: { type: logic, target: submitPurchaseBill } }

      - id: purchase-return
        name: 进货退货查询
        pages:
          - id: PurchaseReturnList
            name: 进货退货列表
            kind: list
            entity: PurchaseReturnBill
            query: searchPurchaseReturns
            columns: [billNo, returnDate, sourceBillNo, totalAmount, status]
            search: [billNo]
            buttons: []

  - id: sales
    name: 销售管理
    functions:
      - id: sales-bill
        name: 销货单
        pages:
          - id: SalesBillList
            name: 销货单列表
            kind: list
            entity: SalesBill
            query: searchSalesBills
            columns: [billNo, billDate, customerId, status, totalAmount, settleMode]
            search: [billNo, status]
            buttons:
              - { id: add, name: 新增销货单, scope: page, action: { type: openDialog, target: SalesBillEdit } }
              - { id: edit, name: 编辑, scope: row, action: { type: openDialog, target: SalesBillEdit } }
              - { id: remove, name: 删除, scope: row, action: { type: logic, target: deleteSalesBill } }
              - { id: copy, name: 复制, scope: row, action: { type: logic, target: copySalesBill } }
              - { id: ret, name: 整单退货, scope: row, action: { type: logic, target: returnSalesBill } }
          - id: SalesBillEdit
            name: 销货单编辑
            kind: dialog-form
            entity: SalesBill
            fields: [billNo, billDate, customerId, contractNo, invoiceNo, logisticsCompany, logisticsNo, settleMode, remark]
            subform:
              repeat: items
              entity: SalesBillItem
              fields: [goodsId, qty, price]
            buttons:
              - { id: draft, name: 暂存, scope: page, action: { type: logic, target: saveSalesBill } }
              - { id: submit, name: 提交, scope: page, action: { type: logic, target: submitSalesBill } }

      - id: sales-return
        name: 销货退货查询
        pages:
          - id: SalesReturnList
            name: 销货退货列表
            kind: list
            entity: SalesReturnBill
            query: searchSalesReturns
            columns: [billNo, returnDate, sourceBillNo, totalAmount, status]
            search: [billNo]
            buttons: []

  - id: inventory
    name: 库存查询
    functions:
      - id: summary
        name: 进销存汇总
        pages:
          - id: InventorySummary
            name: 进销存汇总表
            kind: list
            query: inventorySummary
            columns: [goodsCode, goodsName, category, spec, unit, safetyStock, inQty, inRetQty, outQty, outRetQty, stock]
            search: [goodsCode]
            buttons: []

  - id: finance
    name: 应收应付
    functions:
      - id: payable
        name: 应付款
        pages:
          - id: PayableList
            name: 应付款列表
            kind: list
            entity: Payable
            query: searchPayables
            columns: [billNo, supplierId, amount, invoiceNo, paidAmount, status]
            search: [billNo, status]
            buttons:
              - { id: confirm, name: 确认, scope: row, action: { type: logic, target: confirmPayable } }
              - { id: invoice, name: 开票, scope: row, action: { type: logic, target: invoicePayable } }
              - { id: pay, name: 回款, scope: row, action: { type: logic, target: payPayable } }

      - id: receivable
        name: 应收款
        pages:
          - id: ReceivableList
            name: 应收款列表
            kind: list
            entity: Receivable
            query: searchReceivables
            columns: [billNo, customerId, amount, invoiceNo, paidAmount, status]
            search: [billNo, status]
            buttons:
              - { id: confirm, name: 确认, scope: row, action: { type: logic, target: confirmReceivable } }
              - { id: invoice, name: 开票, scope: row, action: { type: logic, target: invoiceReceivable } }
              - { id: pay, name: 回款, scope: row, action: { type: logic, target: payReceivable } }
