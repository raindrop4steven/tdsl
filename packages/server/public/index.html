<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>TDSL Agent — 在线工程助手</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 0; display: flex; height: 100vh; }
  #chat { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #ddd; }
  #log { flex: 1; overflow-y: auto; padding: 1rem; }
  .user { background: #e8f0fe; padding: .5rem .8rem; border-radius: 8px; margin: .4rem 0; white-space: pre-wrap; }
  .agent { padding: .5rem .8rem; margin: .4rem 0; white-space: pre-wrap; }
  .tool { background: #f6f8fa; border: 1px solid #e1e4e8; padding: .4rem .6rem; border-radius: 6px; margin: .3rem 0; font-size: .85rem; color: #555; white-space: pre-wrap; }
  .err { color: #c0392b; }
  .exp { padding: .5rem .8rem; margin: 0 .4rem .4rem 0; border: 1px solid #4472C4; background: #fff; color: #4472C4; border-radius: 4px; cursor: pointer; }
  .exp:disabled { border-color: #ccc; color: #ccc; cursor: not-allowed; }
  .exp:not(:disabled):hover { background: #4472C4; color: #fff; }
  #inputBar { display: flex; border-top: 1px solid #ddd; }
  #input { flex: 1; padding: .8rem; border: none; outline: none; font-size: 1rem; font-family: inherit; }
  #send { padding: .8rem 1.4rem; border: none; background: #4472C4; color: #fff; cursor: pointer; }
  #panel { width: 40%; overflow-y: auto; padding: 1rem; background: #fafafa; }
  pre { background: #fff; border: 1px solid #eee; padding: .6rem; font-size: .8rem; overflow-x: auto; }
</style>
</head>
<body>
<div id="chat">
  <div id="log"><div class="agent">已就绪。描述你要的 TDSL 应用（如“做一个库存管理，含入库/出库/库存查询”），Agent 将分功能域写 .tdsl → 编译 → 自修。</div></div>
  <div id="inputBar">
    <input id="input" placeholder="描述需求，回车发送…">
    <button id="send">发送</button>
  </div>
</div>
<div id="panel">
  <h3>Agent 轨迹</h3><div id="trace">（工具调用与诊断会显示在这里）</div>
  <h3>产物导出</h3>
  <div id="exportBar">
    <button class="exp" data-target="java" disabled>导出 Java (zip)</button>
    <button class="exp" data-target="react" disabled>导出 React (zip)</button>
    <button class="exp" data-target="all" disabled>导出全部+tdsl源码 (zip)</button>
  </div>
  <div id="exportHint" style="color:#888;font-size:.85rem">agent 调用 generate_code 落盘后可导出</div>
  <h3>运行状态（M10）</h3>
  <div id="runPanel" style="font-size:.85rem;color:#555">轮询中…</div>
  <div id="runBar" style="margin-top:6px">
    <button class="runbtn" data-action="up">▶ 启动</button>
    <button class="runbtn" data-action="restart">↻ 重启</button>
    <button class="runbtn" data-action="down">■ 停止</button>
  </div>
  <div id="runMsg" style="font-size:.75rem;color:#c0392b;margin-top:4px"></div>
  <h3><button id="dbgBtn" style="background:none;border:1px solid #999;border-radius:4px;cursor:pointer;font-size:.8rem;padding:2px 8px">🐞 调试日志</button></h3>
  <pre id="dbgLog" style="display:none;max-height:300px;overflow:auto;background:#1e1e1e;color:#9cdcaa;font-size:.72rem;white-space:pre-wrap">(关闭中)</pre>
</div>

<script>
const log = document.getElementById('log'), trace = document.getElementById('trace');
const input = document.getElementById('input'), sendBtn = document.getElementById('send');
let sessionId = null, ws = null, retries = 0;

function append(cls, text) {
  const div = document.createElement('div');
  div.className = cls; div.textContent = text; log.appendChild(div);
  log.scrollTop = log.scrollHeight; return div;
}
function traceAppend(text) {
  const div = document.createElement('div');
  div.className = 'tool'; div.textContent = text; trace.appendChild(div);
  trace.scrollTop = trace.scrollHeight; return div;
}

async function connect(fresh) {
  try {
    if (fresh || !sessionId) {
      const r = await fetch('/api/session', { method: 'POST' });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.sessionId) throw new Error(data.error || `会话创建失败 (HTTP ${r.status})`);
      sessionId = data.sessionId;
      sessionStorage.setItem('tdslSession', sessionId);
    }
    const sock = new WebSocket(`ws://${location.host}/?sessionId=${sessionId}`);
    ws = sock;
    sock.onopen = () => { retries = 0; sendBtn.disabled = false; };
    sock.onmessage = (ev) => {
      const e = JSON.parse(ev.data);
      if (e.type === 'ready') {
        trace.textContent = '';
        // 恢复导出按钮态（刷新页面/重连后按沙箱实际落盘情况）
        fetch(`/api/generated/${sessionId}`).then((r) => r.json()).then((s) => {
          const any = s.java || s.react;
          document.querySelectorAll('.exp').forEach((b) => {
            b.disabled = !any || (b.dataset.target === 'java' && !s.java) || (b.dataset.target === 'react' && !s.react);
          });
          document.getElementById('exportHint').textContent = any
            ? '已落盘 generated/，点上方按钮下载 zip'
            : 'agent 调用 generate_code 落盘后可导出';
        }).catch(() => {});
        return;
      }
      if (e.type === 'delta') {
        if (!ws._cur || ws._curDone) { ws._cur = append('agent', ''); ws._curDone = false; }
        ws._cur.textContent += e.text;
        log.scrollTop = log.scrollHeight;
      }
      if (e.type === 'message_end' && e.role === 'assistant') ws._curDone = true;
      if (e.type === 'error') { append('err', '⚠ ' + e.message); }
      if (e.type === 'tool_start') ws._toolDiv = traceAppend(`▶ ${e.tool} ${JSON.stringify(e.args ?? {}).slice(0, 400)}`);
      if (e.type === 'tool_end') {
        const text = JSON.stringify(e.result, null, 1);
        if (ws._toolDiv) ws._toolDiv.textContent += '\n' + text.slice(0, 1200);
        else traceAppend(text.slice(0, 1200));
        if (/error|错误|失败/.test(text)) ws._toolDiv.classList?.add('err');
        if (e.tool === 'generate_code' && /已落盘/.test(text)) {
          document.querySelectorAll('.exp').forEach((b) => { b.disabled = false; });
          document.getElementById('exportHint').textContent = '已落盘 generated/{java,react}/，点上方按钮下载 zip';
        }
      }
    };
    sock.onclose = (ev) => {
      sendBtn.disabled = true;
      if (retries++ < 3) {
        // 服务重启后旧 sessionId 会失效（close 4001），换新会话重建
        append('err', `连接断开（${ev.code}），正在重建会话…(${retries}/3)`);
        connect(true);
      } else {
        append('err', '多次重连失败，请刷新页面并查看服务端控制台输出。');
      }
    };
  } catch (err) {
    append('err', '初始化失败: ' + (err?.message ?? err));
  }
}

function send() {
  const text = input.value.trim();
  if (!text) return;
  if (!ws || ws.readyState !== 1) {
    append('err', '连接尚未就绪，请稍候（正在自动重连）…');
    return;
  }
  append('user', text); input.value = '';
  ws.send(JSON.stringify({ type: 'prompt', text }));
}
sendBtn.disabled = true;
sendBtn.onclick = send;
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
document.querySelectorAll('.exp').forEach((b) => {
  b.onclick = () => { location.href = `/api/export/${sessionId}/${b.dataset.target}`; };
});
connect(sessionStorage.getItem('tdslSession') ? false : true);

// 🐞 调试面板：轮询 /api/agent-log（agent 事件日志：模型请求/返回/工具/错误/重试）
let dbgOn = false;
document.getElementById('dbgBtn').onclick = () => {
  dbgOn = !dbgOn;
  const box = document.getElementById('dbgLog');
  box.style.display = dbgOn ? 'block' : 'none';
  document.getElementById('dbgBtn').textContent = dbgOn ? '🐞 调试（开）' : '🐞 调试';
  if (dbgOn) pollDebug();
};
function pollDebug() {
  if (!dbgOn || !sessionId) return;
  fetch(`/api/agent-log/${sessionId}`).then((r) => r.text()).then((t) => {
    const box = document.getElementById('dbgLog');
    if (box.textContent !== t) {
      box.textContent = t;
      box.scrollTop = box.scrollHeight;
    }
  }).catch(() => {});
  setTimeout(pollDebug, 1000);
}

// 运行状态面板：2s 轮询（up 后可直接点开前端页面）
setInterval(() => {
  if (!sessionId) return;
  fetch(`/api/run-status/${sessionId}`).then((r) => r.json()).then((s) => {
    if (s.error) return;
    const dot = (st) => ({ up: '🟢', starting: '🟡', failed: '🔴', idle: '⚪', down: '⚪' }[st] ?? '⚪');
    document.getElementById('runPanel').innerHTML =
      `${dot(s.backend)} 后端 ${s.backend} :${s.backendPort}<br>` +
      `${dot(s.frontend)} 前端 ${s.frontend} :${s.frontendPort}<br>` +
      (s.frontend === 'up' ? `<a href="${s.urls.frontend}" target="_blank">打开应用页面 ↗</a>` : '');
  }).catch(() => {});
}, 2000);

// 运行按钮：手动启停（up 需要产物已生成，否则提示先生成）
document.querySelectorAll('.runbtn').forEach((b) => {
  b.style.cssText = 'padding:4px 10px;margin:0 6px 6px 0;border:1px solid #2E7D32;background:#fff;color:#2E7D32;border-radius:4px;cursor:pointer';
  b.onclick = () => {
    if (!sessionId) return;
    fetch(`/api/run/${sessionId}/${b.dataset.action}`, { method: 'POST' })
      .then((r) => r.json())
      .then((d) => {
        document.getElementById('runMsg').textContent = d.error ?? d.message ?? '';
      })
      .catch(() => {});
  };
});
</script>
</body>
</html>
